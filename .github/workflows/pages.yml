name: Test and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read      # deploy-pages v5 looks the artifact up by id

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Test Phase 2 server rules (Supabase Edge Functions)
        run: npx -y deno@2.9.6 test supabase/functions/tests/ && npx -y deno@2.9.6 check supabase/functions/*/index.ts
      - run: python scraper/build.py
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site (React app in web/ plus the static files in site/)
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
